name: thesis-product-agent
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: product_agent
      POSTGRES_USER: product_agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U product_agent -d product_agent"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
